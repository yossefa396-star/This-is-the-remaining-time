<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>This is the remaining time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Manrope:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #232428;
    --bg-2: #141517;
    --bg-3: #09090b;
    --cream: #f4ecda;
    --cream-dim: rgba(244, 236, 218, 0.62);
    --lilac: #c9a9ea;
    --lilac-soft: rgba(201, 169, 234, 0.35);
    --glass-border: rgba(244, 236, 218, 0.14);
    --track: rgba(244, 236, 218, 0.08);
    --serif: "Cormorant Garamond", "Times New Roman", Georgia, serif;
    --sans: "Manrope", "Helvetica Neue", Arial, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: dark;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100%;
    background-color: var(--bg-3);
    background-image:
      radial-gradient(1100px 700px at 50% -10%, var(--bg-1) 0%, transparent 70%),
      radial-gradient(900px 600px at 50% 120%, rgba(201,169,234,0.08) 0%, transparent 70%),
      linear-gradient(180deg, var(--bg-2) 0%, var(--bg-3) 100%);
    background-attachment: fixed;
    color: var(--cream);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  .grain {
    position: fixed; inset: 0; pointer-events: none; opacity: .07; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  main {
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: clamp(28px, 6vh, 64px) clamp(16px, 4vw, 48px) 48px;
  }
  h1 {
    margin: 0;
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(1.5rem, 3.6vw, 2.6rem);
    letter-spacing: .32em;
    text-transform: uppercase;
    color: var(--cream);
    text-align: center;
    padding-left: .32em;
  }
  h1::after {
    content: "";
    display: block;
    width: 64px; height: 1px;
    margin: 22px auto 0;
    background: linear-gradient(90deg, transparent, var(--cream-dim), transparent);
  }
  .stage {
    flex: 1;
    width: 100%;
    max-width: 1040px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: clamp(36px, 7vh, 72px);
    padding-top: 32px;
  }
  .counter {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: clamp(10px, 2vw, 24px);
  }
  .cell {
    position: relative;
    padding: clamp(22px, 4.5vw, 52px) 8px clamp(16px, 3vw, 34px);
    text-align: center;
    background: linear-gradient(160deg, rgba(244,236,218,0.045), rgba(244,236,218,0.01));
    border: 1px solid var(--glass-border);
    border-radius: 22px;
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 30px 60px -30px rgba(0,0,0,0.6);
  }
  .num {
    display: block;
    font-family: var(--sans);
    font-weight: 200;
    font-size: clamp(2.2rem, 8.4vw, 6.4rem);
    line-height: 1;
    letter-spacing: -.02em;
    color: var(--cream);
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 40px rgba(244,236,218,0.12);
  }
  .label {
    display: block;
    margin-top: clamp(12px, 2vw, 22px);
    font-size: clamp(.58rem, 1.3vw, .8rem);
    font-weight: 300;
    letter-spacing: .34em;
    text-transform: uppercase;
    color: var(--cream-dim);
    padding-left: .34em;
  }
  .bar-wrap { width: 100%; }
  .bar-ends {
    display: flex; justify-content: space-between;
    font-family: var(--serif);
    font-size: clamp(.95rem, 1.8vw, 1.2rem);
    letter-spacing: .2em;
    color: var(--cream-dim);
    margin-bottom: 14px;
  }
  .track {
    position: relative;
    height: 10px;
    border-radius: 999px;
    background: var(--track);
    border: 1px solid var(--glass-border);
    overflow: hidden;
  }
  .fill {
    position: absolute; inset: 0 auto 0 0;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, #a98bd0, var(--lilac) 60%, #e3d0f7);
    box-shadow: 0 0 22px var(--lilac-soft);
    transition: width 1s linear;
    overflow: hidden;
  }
  .fill::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,0.45) 50%, transparent 70%);
    transform: translateX(-100%);
    animation: shimmer 4.5s ease-in-out infinite;
  }
  @keyframes shimmer { 60%, 100% { transform: translateX(100%); } }
  .live {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 20px);
    right: 22px;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #3ddc84;
    box-shadow: 0 0 10px 2px rgba(61,220,132,0.7), 0 0 24px 6px rgba(61,220,132,0.35);
    animation: glow 2.2s ease-in-out infinite;
    z-index: 5;
  }
  @keyframes glow {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: .18; transform: scale(.82); }
  }
  @media (max-width: 560px) {
    .counter { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .num { font-size: clamp(2.6rem, 16vw, 4.4rem); }
  }
  @media (prefers-reduced-motion: reduce) {
    .fill::after { animation: none; }
    .fill { transition: none; }
  }
</style>
</head>
<body>
<div class="grain"></div>
<div class="live" aria-hidden="true"></div>
<main>
  <h1>This is the remaining time</h1>

  <div class="stage">
    <section class="counter" aria-live="off">
      <div class="cell"><span class="num" id="y">00</span><span class="label">Years</span></div>
      <div class="cell"><span class="num" id="m">00</span><span class="label">Months</span></div>
      <div class="cell"><span class="num" id="d">00</span><span class="label">Days</span></div>
      <div class="cell"><span class="num" id="h">00</span><span class="label">Hours</span></div>
    </section>

    <section class="bar-wrap">
      <div class="bar-ends"><span>2026</span><span>2066</span></div>
      <div class="track"><div class="fill" id="fill"></div></div>
    </section>
  </div>
</main>

<script>
(function () {
  var START  = new Date(2026, 0, 1, 0, 0, 0);
  var TARGET = new Date(2066, 0, 1, 0, 0, 0);
  var el = {
    y: document.getElementById('y'),
    m: document.getElementById('m'),
    d: document.getElementById('d'),
    h: document.getElementById('h'),
    fill: document.getElementById('fill')
  };
  function pad(n) { return n < 10 ? '0' + n : String(n); }

  function diff(a, b) {
    var y = b.getFullYear() - a.getFullYear();
    var m = b.getMonth() - a.getMonth();
    var d = b.getDate() - a.getDate();
    var h = b.getHours() - a.getHours();
    if (h < 0) { h += 24; d--; }
    if (d < 0) { d += new Date(b.getFullYear(), b.getMonth(), 0).getDate(); m--; }
    if (m < 0) { m += 12; y--; }
    return { y: y, m: m, d: d, h: h };
  }

  function tick() {
    var now = new Date();
    if (now >= TARGET) {
      el.y.textContent = el.m.textContent = el.d.textContent = el.h.textContent = '00';
      el.fill.style.width = '100%';
      return;
    }
    var t = diff(now < START ? START : now, TARGET);
    el.y.textContent = pad(t.y);
    el.m.textContent = pad(t.m);
    el.d.textContent = pad(t.d);
    el.h.textContent = pad(t.h);
    var total = TARGET - START;
    var elapsed = Math.max(0, Math.min(1, (now - START) / total));
    el.fill.style.width = (elapsed * 100).toFixed(3) + '%';
  }
  tick();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
